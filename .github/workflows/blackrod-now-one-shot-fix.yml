name: Blackrod Now one-shot fix

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/blackrod-now-one-shot-fix.yml'

permissions:
  contents: write

jobs:
  patch-main:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Patch inbound email handling and route scroll
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          server_path = Path('backend/server.py')
          server = server_path.read_text(encoding='utf-8')

          start_marker = '@api.post("/webhooks/resend")\nasync def resend_webhook_email_received(request: Request):'
          end_marker = '\n\nclass AdminMessageReplyReq(BaseModel):'
          start = server.find(start_marker)
          if start < 0:
              raise SystemExit('Could not find Resend webhook handler start')
          end = server.find(end_marker, start)
          if end < 0:
              raise SystemExit('Could not find Resend webhook handler end')

          replacement = r'''def _retrieve_resend_received_email(email_id: str) -> Dict[str, Any]:
    """Retrieve the full inbound email body/headers from Resend.

    Resend's email.received webhook intentionally contains metadata only. The
    full message must be fetched from /emails/receiving/{email_id}.
    """
    if not RESEND_API_KEY:
        raise RuntimeError("RESEND_API_KEY is not configured")
    clean_id = str(email_id or "").strip()
    if not clean_id:
        raise RuntimeError("Resend webhook did not include data.email_id")

    response = requests.get(
        f"https://api.resend.com/emails/receiving/{clean_id}",
        headers={
            "Authorization": f"Bearer {RESEND_API_KEY}",
            "Accept": "application/json",
        },
        timeout=20,
    )
    if not response.ok:
        detail = (response.text or "")[:500]
        raise RuntimeError(
            f"Resend received-email retrieval failed ({response.status_code}): {detail}"
        )
    payload = response.json()
    if not isinstance(payload, dict):
        raise RuntimeError("Resend received-email retrieval returned an invalid payload")
    return payload


@api.post("/webhooks/resend")
async def resend_webhook_email_received(request: Request):
    raw = await request.body()
    svix_id = request.headers.get("svix-id", "")
    svix_timestamp = request.headers.get("svix-timestamp", "")
    svix_signature = request.headers.get("svix-signature", "")
    verified, reason = _verify_resend_webhook_signature(raw, svix_id, svix_timestamp, svix_signature)
    if not verified:
        raise HTTPException(401, f"Invalid webhook signature: {reason}")

    try:
        payload = json.loads(raw.decode("utf-8") or "{}")
    except Exception:
        raise HTTPException(400, "Invalid JSON payload")

    event_type = str(payload.get("type") or payload.get("event") or "").strip()
    if event_type != "email.received":
        return {"ok": True, "ignored": True, "event_type": event_type or "unknown"}

    webhook_data = payload.get("data") if isinstance(payload.get("data"), dict) else payload
    resend_email_id = str(webhook_data.get("email_id") or "").strip()
    if not resend_email_id:
        logger.error("Resend email.received webhook missing data.email_id (svix_id=%s)", svix_id)
        raise HTTPException(400, "Resend webhook missing email_id")

    # email_id is the stable Resend identifier and therefore the correct
    # idempotency key. Do this check before making another provider API call.
    duplicate = await db.messages.find_one(
        {
            "delivery.provider": "resend-webhook",
            "delivery.resend_email_id": resend_email_id,
        },
        {"_id": 0, "id": 1},
    )
    if duplicate:
        return {"ok": True, "duplicate": True, "message_id": duplicate.get("id")}

    # The webhook deliberately does NOT contain text/html/headers. Fetch the
    # canonical received email from Resend before creating the inbox record.
    # Retry briefly because provider storage can occasionally trail the webhook.
    received: Optional[Dict[str, Any]] = None
    retrieval_error: Optional[Exception] = None
    for attempt in range(3):
        try:
            received = await asyncio.to_thread(_retrieve_resend_received_email, resend_email_id)
            retrieval_error = None
            break
        except Exception as exc:
            retrieval_error = exc
            logger.warning(
                "Resend inbound retrieval attempt %s/3 failed for %s: %s",
                attempt + 1,
                resend_email_id,
                exc,
            )
            if attempt < 2:
                await asyncio.sleep(0.75 * (attempt + 1))

    if not received:
        # Do not persist a permanently blank/fallback message. A non-2xx response
        # lets Resend retry delivery of the webhook once the provider/API issue
        # is resolved.
        logger.error(
            "Unable to retrieve Resend inbound email %s; refusing empty inbox record: %s",
            resend_email_id,
            retrieval_error,
        )
        raise HTTPException(503, "Could not retrieve received email content from Resend")

    # Prefer the full received-email response, falling back to webhook metadata
    # only for fields the retrieve endpoint unexpectedly omits.
    data = {**webhook_data, **received}
    from_field = data.get("from") or data.get("sender") or data.get("from_email") or ""
    from_email = _extract_email_address(from_field)

    headers = data.get("headers") or {}
    header_from = _extract_header_value(headers, "from")
    from_name = _extract_sender_name(header_from or from_field)
    subject = str(data.get("subject") or "").strip() or "(No subject)"

    in_reply_to = str(
        data.get("in_reply_to")
        or data.get("inReplyTo")
        or _extract_header_value(headers, "in-reply-to")
        or ""
    ).strip() or None
    internet_message_id = str(
        data.get("message_id")
        or _extract_header_value(headers, "message-id")
        or ""
    ).strip() or None

    body_text = str(data.get("text") or "").strip()
    body_html = str(data.get("html") or "").strip()
    if not body_text and body_html:
        body_text = _html_to_text(body_html)
    if not body_text:
        body_text = "(Email contained no readable message body)"

    org_slug = None
    if from_email:
        org = await db.orgs.find_one({"email": from_email}, {"_id": 0, "slug": 1, "name": 1})
        if org:
            org_slug = org.get("slug")
            if not from_name:
                from_name = org.get("name") or ""

    created = AdminMessage(
        from_org_slug=org_slug,
        from_email=from_email or None,
        from_name=from_name or None,
        subject=subject,
        body=body_text,
        in_reply_to=in_reply_to,
        direction="inbound_org",
        delivery={
            "provider": "resend-webhook",
            "event_type": event_type,
            "event_id": resend_email_id,
            "resend_email_id": resend_email_id,
            "internet_message_id": internet_message_id,
            "svix_id": svix_id,
            "retrieved_full_message": True,
            "has_html": bool(body_html),
            "attachments": received.get("attachments") or webhook_data.get("attachments") or [],
        },
    )
    await db.messages.insert_one(created.model_dump())
    return {
        "ok": True,
        "created": True,
        "message_id": created.id,
        "resend_email_id": resend_email_id,
        "from_email": from_email,
        "matched_org_slug": org_slug,
    }
'''

          server = server[:start] + replacement + server[end:]
          server_path.write_text(server, encoding='utf-8')

          app_path = Path('frontend/src/App.js')
          app = app_path.read_text(encoding='utf-8')
          old_import = 'import { BrowserRouter, Routes, Route, Navigate } from "react-router-dom";'
          new_import = 'import { BrowserRouter, Routes, Route, Navigate, useLocation } from "react-router-dom";'
          if old_import in app:
              app = app.replace(old_import, new_import, 1)
          elif new_import not in app:
              raise SystemExit('Could not safely update react-router-dom import')

          if 'function ScrollToTop()' not in app:
              anchor = 'function RequireRole({ allowed, children }) {'
              scroll_component = '''function ScrollToTop() {\n    const { pathname } = useLocation();\n\n    React.useEffect(() => {\n        window.scrollTo({ top: 0, left: 0, behavior: "auto" });\n    }, [pathname]);\n\n    return null;\n}\n\n'''
              if anchor not in app:
                  raise SystemExit('Could not find RequireRole anchor for ScrollToTop')
              app = app.replace(anchor, scroll_component + anchor, 1)

          if '<ScrollToTop />' not in app:
              router_anchor = '            <BrowserRouter>\n'
              if router_anchor not in app:
                  raise SystemExit('Could not find BrowserRouter anchor')
              app = app.replace(router_anchor, router_anchor + '                <ScrollToTop />\n', 1)

          app_path.write_text(app, encoding='utf-8')
          PY

      - name: Validate backend syntax
        run: python -m py_compile backend/server.py

      - name: Review patch
        run: git diff --check && git diff --stat && git diff -- backend/server.py frontend/src/App.js

      - name: Commit fixes to main and remove this one-shot workflow
        shell: bash
        run: |
          git config user.name "Blackrod Now maintenance"
          git config user.email "blackrodnow@communityalliances.co.uk"
          git add backend/server.py frontend/src/App.js
          git rm .github/workflows/blackrod-now-one-shot-fix.yml
          git commit -m "Fix inbound email bodies and scroll routes to top"
          git push origin HEAD:main
