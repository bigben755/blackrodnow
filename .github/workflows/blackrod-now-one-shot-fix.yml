name: Blackrod Now one-shot fix

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/blackrod-now-one-shot-fix.yml'

permissions:
  contents: write

jobs:
  patch-main:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Patch inbound email handling and route scroll
        shell: bash
        run: |
          echo '' | base64 -d > /tmp/blackrod_patch.py
          python /tmp/blackrod_patch.py

      - name: Validate backend syntax
        run: python -m py_compile backend/server.py

      - name: Review patch
        run: git diff --check && git diff --stat

      - name: Commit fixes to main and remove this one-shot workflow
        shell: bash
        run: |
          git config user.name "Blackrod Now maintenance"
          git config user.email "blackrodnow@communityalliances.co.uk"
          git add backend/server.py frontend/src/App.js
          git rm .github/workflows/blackrod-now-one-shot-fix.yml
          git commit -m "Fix inbound email bodies and scroll routes to top"
          git push origin HEAD:main
