''', 'OG cache header')

          replace_once(path,
          '''        og_url = f"{base}/api/events/{e['id']}/og"
''',
          '''        og_url = f"{base}/api/events/{e['id']}/og?bn_card=2"
''', 'share pack OG cache version')

          # ------------------------------------------------------------
          # ShareButtons: use a versioned rich-card URL so Facebook is forced
          # to scrape the fixed event OG page instead of reusing its old cache.
          # ------------------------------------------------------------
          path = 'frontend/src/components/ShareButtons.jsx'
          replace_once(path,
          '''    const canonicalUrl = url || (typeof window !== "undefined" ? window.location.href : "");
    const socialUrl = ogUrl || canonicalUrl;
    const enc = (s) => encodeURIComponent(s || "");
''',
          '''    const canonicalUrl = url || (typeof window !== "undefined" ? window.location.href : "");
    const socialUrl = (() => {
        if (!ogUrl) return canonicalUrl;
        if (/[?&]bn_card=/.test(ogUrl)) return ogUrl;
        return `${ogUrl}${ogUrl.includes("?") ? "&" : "?"}bn_card=2`;
    })();
    const enc = (s) => encodeURIComponent(s || "");
''', 'ShareButtons rich-card URL')

          replace_once(path,
          '''                        toast.success("Caption copied — paste it into your Facebook post", { duration: 6000 });
''',
          '''                        toast.success("Blackrod Now caption copied — Facebook will attach the event card", { duration: 6000 });
''', 'Facebook share toast')

          # ------------------------------------------------------------
          # Event detail: branded Blackrod Now copy for organiser sharing.
          # ------------------------------------------------------------
          path = 'frontend/src/pages/EventDetail.jsx'
          replace_once(path,
          '''    const facebookPost =
        buildFacebookPost(
            event,
            eventUrl,
            org
        );

    const saved =
''',
          '''    const facebookPost =
        buildFacebookPost(
