name: Patch rich Facebook event sharing

on:
  push:
    paths:
      - '.github/workflows/_rich_facebook_event_share.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply patch
        run: |
          echo '' | base64 -d > /tmp/patch.py
          python /tmp/patch.py

      - name: Validate
        run: |
          python -m py_compile backend/server.py
          grep -q 'share_url_esc' backend/server.py
          grep -q 'parsed-create-facebook' frontend/src/pages/OrgDashboard.jsx
          grep -q 'bn_card=2' frontend/src/components/ShareButtons.jsx
          grep -q 'brandedShareText' frontend/src/pages/EventDetail.jsx
          grep -q 'shareCaption' frontend/src/components/PostNowDialog.jsx

      - name: Commit patch and clean up
        run: |
          git config user.name "Blackrod Now maintenance"
          git config user.email "actions@users.noreply.github.com"
          git add backend/server.py frontend/src/components/ShareButtons.jsx frontend/src/pages/EventDetail.jsx frontend/src/components/PostNowDialog.jsx frontend/src/pages/OrgDashboard.jsx
          git commit -m "Fix rich Facebook event sharing"
          git push origin main
          git rm .github/workflows/_rich_facebook_event_share.yml
          git commit -m "Remove temporary Facebook share patch workflow"
          git push origin main
