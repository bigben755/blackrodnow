                            }`}
                            url={eventUrl}
''',
          '''                        <ShareButtons
                            text={brandedShareText}
                            url={eventUrl}
''', 'EventDetail ShareButtons text')

          # ------------------------------------------------------------
          # Post Now: every social share gets explicit Blackrod Now wording.
          # ------------------------------------------------------------
          path = 'frontend/src/components/PostNowDialog.jsx'
          replace_once(path,
          '''    const posterPngUrl = event?.id ? api.eventPosterPngUrl(event.id) : "";
    const link = bundle?.link || "";

    return (
''',
          '''    const posterPngUrl = event?.id ? api.eventPosterPngUrl(event.id) : "";
    const link = bundle?.link || "";
    const shareCaption = /blackrod now/i.test(caption || "")
        ? caption
        : `📣 Blackrod Now\\n\\n${caption || ""}\\n\\nWhat's on. What's new. What's next.`.trim();

    return (
''', 'PostNow branded caption')

          replace_once(path,
          '''                await navigator.share({ files: [file], text: caption, title: event?.title });
''',
          '''                await navigator.share({ files: [file], text: shareCaption, title: event?.title });
''', 'PostNow native branded share')

          replace_once(path,
          '''                                            caption.includes(link) ? caption : `${caption}\\n\\n${link}`,
''',
          '''                                            shareCaption.includes(link) ? shareCaption : `${shareCaption}\\n\\n${link}`,
''', 'PostNow copy branded caption')

          replace_once(path,
          '''                                text={caption}
''',
          '''                                text={shareCaption}
''', 'PostNow ShareButtons branded caption')

          # ------------------------------------------------------------
          # Organisation Smart Import: add Create + Facebook. It creates the
          # real event first so Facebook can scrape a real event-specific OG
          # card, then opens Facebook in the already-opened user-gesture tab.
          # ------------------------------------------------------------
          path = 'frontend/src/pages/OrgDashboard.jsx'
          replace_once(path,
          '''import { api } from "@/lib/api";
''',
          '''import { api, API } from "@/lib/api";
''', 'OrgDashboard API import')

          replace_once(path,
          '''    CalendarClock,
} from "lucide-react";
''',
          '''    CalendarClock,
    Facebook,
} from "lucide-react";
''', 'OrgDashboard Facebook icon')

          replace_once(path,
          '''    const publishEvent = async (
        item,
        { recurrenceFreq = "none", recurrenceUntil = "" } = {}
    ) => {
        if (!selectedOrgSlug) {
            toast.error("Choose an organisation first");
            return;
        }

        let start;
''',
          '''    const publishEvent = async (
        item,
        { recurrenceFreq = "none", recurrenceUntil = "", shareAfter = "" } = {}
    ) => {
        if (!selectedOrgSlug) {
            toast.error("Choose an organisation first");
            return;
        }

        let facebookWindow = null;
        if (shareAfter === "facebook" && typeof window !== "undefined") {
            facebookWindow = window.open("", "_blank");
            if (facebookWindow) {
                facebookWindow.document.title = "Preparing Blackrod Now Facebook post…";
                facebookWindow.document.body.innerHTML = "<p style='font-family:system-ui;padding:24px'>Preparing your Blackrod Now event for Facebook…</p>";
            }
        }

        let start;
''', 'OrgDashboard publishEvent share option')

          replace_once(path,
          '''            const publishedNow = created?.status === "approved";
            setEventFilter(publishedNow ? "upcoming" : "pending");
            if (created?.id) {
                setPostNowEvent(created);
            }

            toast.success(
''',
          '''            const publishedNow = created?.status === "approved";
            setEventFilter(publishedNow ? "upcoming" : "pending");
            if (created?.id) {
                setPostNowEvent(created);
            }

            if (shareAfter === "facebook" && created?.id) {
                const coreCaption = (item.social_caption || item.description || item.title || "").trim();
                const brandedCaption = /blackrod now/i.test(coreCaption)
                    ? coreCaption
                    : `📣 Blackrod Now\\n\\n${coreCaption}\\n\\nWhat's on. What's new. What's next.`.trim();
                try {
                    await navigator.clipboard.writeText(brandedCaption);
                } catch {
                    // Facebook still opens if clipboard permission is unavailable.
                }
                const richShareUrl = `${API}/events/${created.id}/og?bn_card=2`;
                const facebookUrl = `https://www.facebook.com/sharer/sharer.php?u=${encodeURIComponent(richShareUrl)}`;
                if (facebookWindow && !facebookWindow.closed) {
                    facebookWindow.location.replace(facebookUrl);
                } else if (typeof window !== "undefined") {
                    window.open(facebookUrl, "_blank");
                }
                toast.success("Facebook post ready", {
                    description: "The Blackrod Now caption is copied and Facebook is opening with the event-specific card.",
                });
            }

            toast.success(
''', 'OrgDashboard launch Facebook after create')

          replace_once(path,
          '''        } catch {
            toast.error("Couldn't create event");
        }
''',
          '''        } catch {
            if (facebookWindow && !facebookWindow.closed) {
                facebookWindow.close();
            }
            toast.error("Couldn't create event");
        }
''', 'OrgDashboard close failed Facebook popup')

          replace_once(path,
          '''                <button data-testid="parsed-publish-update" onClick={onPublishUpdate} className="inline-flex items-center gap-1 px-4 py-2 rounded-full bg-primary text-primary-foreground font-semibold text-xs">
''',
          '''                {it.suggested_type === "event" && (
                    <button
                        data-testid="parsed-create-facebook"
                        onClick={() => onPublishEvent({ recurrenceFreq, recurrenceUntil, shareAfter: "facebook" })}
                        className="inline-flex items-center gap-1 px-4 py-2 rounded-full bg-[#1877F2] text-white font-semibold text-xs"
                    >
                        <Facebook className="h-3.5 w-3.5" /> Create + Facebook
                    </button>
                )}
                <button data-testid="parsed-publish-update" onClick={onPublishUpdate} className="inline-flex items-center gap-1 px-4 py-2 rounded-full bg-primary text-primary-foreground font-semibold text-xs">
''', 'ParsedCard Facebook button')

          replace_once(path,
          '''                        Hit <strong>Create event</strong> first — you'll then get a ready-made post with
                        your organisation's details, an event poster and the correct link preview.
''',
          '''                        Use <strong>Create + Facebook</strong> to create the listing and open Facebook with
                        a Blackrod Now caption, event-specific image/poster and the correct rich link preview.
''', 'ParsedCard Facebook hint')

          print('Facebook rich-share patch applied')
          PY

      - name: Validate backend syntax and changed markers
        run: |
          python -m py_compile backend/server.py
          grep -q 'share_url_esc' backend/server.py
          grep -q 'parsed-create-facebook' frontend/src/pages/OrgDashboard.jsx
          grep -q 'bn_card=2' frontend/src/components/ShareButtons.jsx
          grep -q 'brandedShareText' frontend/src/pages/EventDetail.jsx
          grep -q 'shareCaption' frontend/src/components/PostNowDialog.jsx

      - name: Commit patch and remove temporary workflow
        run: |
          git config user.name "Blackrod Now maintenance"
          git config user.email "actions@users.noreply.github.com"
          git add backend/server.py frontend/src/components/ShareButtons.jsx frontend/src/pages/EventDetail.jsx frontend/src/components/PostNowDialog.jsx frontend/src/pages/OrgDashboard.jsx
          git commit -m "Fix rich Facebook event sharing"
          git push origin main
          git rm .github/workflows/_rich_facebook_event_share.yml
          git commit -m "Remove temporary Facebook share patch workflow"
          git push origin main
