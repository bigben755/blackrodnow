name: Patch admin audit organisation handling

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/_patch_admin_org_audit.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Patch audit backend and admin UI
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          import textwrap

          server_path = Path("backend/server.py")
          server = server_path.read_text()

          new_sanitiser = textwrap.dedent('''\
          async def _audit_sanitise_changes(event: dict, data: dict) -> List[dict]:
              changes: List[dict] = []
              for edit in (data.get("proposed_edits") or [])[:8]:
                  if not isinstance(edit, dict):
                      continue
                  field = edit.get("field")
                  new_value = str(edit.get("new_value") or "").strip()
                  if not new_value:
                      continue
                  evidence = str(edit.get("evidence") or "")[:400]
                  source_url = str(edit.get("source_url") or "")[:400]
                  if field == "organisation":
                      # If the verified organiser does not exist yet, create a
                      # pending profile for explicit admin review rather than
                      # silently discarding the organisation correction.
                      def _org_key(value: Any) -> str:
                          return re.sub(r"[^a-z0-9]+", "", str(value or "").lower())

                      current = await db.orgs.find_one(
                          {"slug": event.get("orgSlug")},
                          {"_id": 0, "slug": 1, "name": 1, "status": 1},
                      )
                      wanted_key = _org_key(new_value)
                      if current and _org_key(current.get("name")) == wanted_key:
                          continue

                      org_rows = await db.orgs.find(
                          {},
                          {"_id": 0, "slug": 1, "name": 1, "status": 1},
                      ).to_list(1000)
                      target = next(
                          (row for row in org_rows if _org_key(row.get("name")) == wanted_key),
                          None,
                      )
                      created_for_approval = False

                      if not target:
                          # New profiles require source evidence and remain hidden
                          # from the public site until an admin approves them.
                          if not source_url:
                              continue
                          base_slug = re.sub(r"[^a-z0-9]+", "-", new_value.lower()).strip("-")[:72]
                          if not base_slug:
                              base_slug = f"organisation-{new_id()[:8]}"
                          used_slugs = {str(row.get("slug") or "") for row in org_rows}
                          target_slug = base_slug
                          suffix = 2
                          while target_slug in used_slugs:
                              target_slug = f"{base_slug[:68]}-{suffix}"
                              suffix += 1

                          new_org = Organisation(
                              slug=target_slug,
                              name=new_value,
                              category="Community groups",
                              status="pending",
                              verified=False,
                              trust_level="new",
                          ).model_dump()
                          new_org["audit_origin"] = {
                              "source": "event_accuracy_audit",
                              "event_id": event.get("id") or "",
                              "event_title": event.get("title") or "",
                              "evidence": evidence,
                              "source_url": source_url,
                              "created_at": now_iso(),
                          }
                          await db.orgs.insert_one(new_org)
                          target = {
                              "slug": target_slug,
                              "name": new_value,
                              "status": "pending",
                          }
                          created_for_approval = True
                          await _audit(
                              action="ai_org_suggested",
                              entity_type="org",
                              entity_id=target_slug,
                              summary=f"AI audit created a pending organisation for review: {new_value}",
                              meta={
                                  "event_id": event.get("id") or "",
                                  "event_title": event.get("title") or "",
                                  "source_url": source_url,
                              },
                              actor="system",
                          )

                      if target["slug"] == (event.get("orgSlug") or ""):
                          continue
                      changes.append({
                          "field": "orgSlug",
                          "old": str(event.get("orgSlug") or ""),
                          "new": target["slug"],
                          "old_display": (current or {}).get("name") or (event.get("orgSlug") or "—"),
                          "new_display": target["name"],
                          "evidence": evidence,
                          "source_url": source_url,
                          "org_status": target.get("status") or "pending",
                          "created_org_for_approval": created_for_approval,
                      })
                      continue
                  if field not in AUDIT_EDITABLE_FIELDS or field == "orgSlug":
                      continue
                  if field in ("start", "end"):
                      new_value = new_value[:19]
                      try:
                          datetime.fromisoformat(new_value)
                      except Exception:
                          continue
                      if new_value[:10] < datetime.now(UK_TZ).strftime("%Y-%m-%d"):
                          continue
                  old_value = str(event.get(field) or "")
                  if new_value == old_value:
                      continue
                  changes.append({
                      "field": field,
                      "old": old_value,
                      "new": new_value,
                      "evidence": evidence,
                      "source_url": source_url,
                  })
              return changes
          ''')

          pattern = r'async def _audit_sanitise_changes\(event: dict, data: dict\) -> List\[dict\]:\n.*?\n    return changes\n\n\nasync def _run_event_audit_job'
          server, count = re.subn(
              pattern,
              new_sanitiser + "\n\nasync def _run_event_audit_job",
              server,
              count=1,
              flags=re.S,
          )
          if count != 1:
              raise SystemExit(f"Audit sanitiser replacement count was {count}; refusing to continue")

          old_list_line = '    return await db.event_edit_proposals.find({"status": status}, {"_id": 0}).sort("created_at", -1).to_list(200)'
          new_list_block = textwrap.indent(textwrap.dedent('''\
          proposals = await db.event_edit_proposals.find({"status": status}, {"_id": 0}).sort("created_at", -1).to_list(200)
          # Resolve the organisation's current status each time so the audit
          # card accurately shows whether a suggested organiser is ready.
          for proposal in proposals:
              for change in proposal.get("changes", []):
                  if change.get("field") != "orgSlug":
                      continue
                  target_org = await db.orgs.find_one(
                      {"slug": change.get("new")},
                      {"_id": 0, "name": 1, "status": 1},
                  )
                  if target_org:
                      change["org_status"] = target_org.get("status") or "pending"
                      change["new_display"] = target_org.get("name") or change.get("new_display") or change.get("new")
                  else:
                      change["org_status"] = "missing"
          return proposals
          '''), "    ").rstrip()
          if server.count(old_list_line) != 1:
              raise SystemExit("Expected proposal list return line was not unique")
          server = server.replace(old_list_line, new_list_block, 1)

          old_approve = (
              '    if "orgSlug" in updates and not await db.orgs.find_one({"slug": updates["orgSlug"]}, {"_id": 0, "slug": 1}):\n'
              '        raise HTTPException(400, "The suggested organisation no longer exists")\n'
          )
          new_approve = textwrap.indent(textwrap.dedent('''\
          if "orgSlug" in updates:
              target_org = await db.orgs.find_one(
                  {"slug": updates["orgSlug"]},
                  {"_id": 0, "slug": 1, "name": 1, "status": 1},
              )
              if not target_org:
                  raise HTTPException(400, "The suggested organisation no longer exists")
              if target_org.get("status") != "approved":
                  raise HTTPException(
                      409,
                      f"Approve {target_org.get('name') or updates['orgSlug']} before assigning this event to it",
                  )
          '''), "    ")
          if old_approve not in server:
              raise SystemExit("Expected organisation approval guard not found")
          server = server.replace(old_approve, new_approve, 1)
          server_path.write_text(server)

          card_path = Path("frontend/src/components/AiAuditCard.jsx")
          card = card_path.read_text()

          old_import = 'import { Sparkles, ExternalLink, Check, X, Loader2, RefreshCw } from "lucide-react";'
          new_import = 'import { Sparkles, ExternalLink, Check, X, Loader2, RefreshCw, Building2, ShieldCheck } from "lucide-react";'
          if old_import in card:
              card = card.replace(old_import, new_import, 1)
          elif new_import not in card:
              raise SystemExit("AiAuditCard icon import was not recognised")

          decide_marker = '    const decide = async (proposal, approve) => {'
          approve_org_fn = textwrap.indent(textwrap.dedent('''\
          const approveSuggestedOrg = async (change) => {
              const slug = String(change?.new || "").trim();
              if (!slug) return;
              setBusy(`org:${slug}`);
              try {
                  await api.setOrgStatus(slug, "approved");
                  setProposals((current) =>
                      current.map((proposal) => ({
                          ...proposal,
                          changes: (proposal.changes || []).map((item) =>
                              item.field === "orgSlug" && item.new === slug
                                  ? { ...item, org_status: "approved" }
                                  : item
                          ),
                      }))
                  );
                  toast.success(`Organisation approved: ${change.new_display || slug}`);
                  if (onApplied) onApplied();
              } catch (error) {
                  toast.error(error?.response?.data?.detail || "Could not approve organisation");
              } finally {
                  setBusy("");
              }
          };
          '''), "    ")
          if "const approveSuggestedOrg = async" not in card:
              if decide_marker not in card:
                  raise SystemExit("AiAuditCard decision marker not found")
              card = card.replace(decide_marker, approve_org_fn + "\n" + decide_marker, 1)

          old_desc = "Checks upcoming events against the live web (organisers' sites, Facebook, Bolton Council). Suggested\n                        corrections appear below with sources — nothing changes until you approve it."
          new_desc = "Checks upcoming events against the live web (organisers' sites, Facebook, Bolton Council). Suggested\n                        corrections appear below with sources. If the real organiser is not on Blackrod Now, a pending organisation is created for review — nothing public changes until you approve it."
          if old_desc in card:
              card = card.replace(old_desc, new_desc, 1)

          source_marker = '                                            {c.source_url ? ('
          org_status_ui = textwrap.indent(textwrap.dedent('''\
          {c.field === "orgSlug" && c.org_status === "approved" ? (
              <div className="mt-2 inline-flex items-center gap-1.5 rounded-full bg-emerald-100 px-2.5 py-1 text-[10px] font-bold text-emerald-900">
                  <ShieldCheck className="h-3 w-3" /> Organisation approved and ready to assign
              </div>
          ) : null}
          {c.field === "orgSlug" && c.org_status && c.org_status !== "approved" && c.org_status !== "missing" ? (
              <div className="mt-2 flex flex-wrap items-center gap-2 rounded-xl border border-amber-200 bg-amber-50 p-2.5 text-amber-950">
                  <Building2 className="h-3.5 w-3.5 shrink-0" />
                  <span className="font-semibold">
                      {c.created_org_for_approval ? "New organisation created — approval required" : `Organisation status: ${c.org_status}`}
                  </span>
                  <button
                      type="button"
                      disabled={busy === `org:${c.new}`}
                      onClick={(event) => {
                          event.preventDefault();
                          event.stopPropagation();
                          approveSuggestedOrg(c);
                      }}
                      className="ml-auto rounded-full bg-amber-900 px-2.5 py-1 text-[10px] font-bold text-white disabled:opacity-50"
                  >
                      {busy === `org:${c.new}` ? "Approving…" : "Approve organisation"}
                  </button>
              </div>
          ) : null}
          {c.field === "orgSlug" && c.org_status === "missing" ? (
              <div className="mt-2 rounded-xl border border-red-200 bg-red-50 p-2.5 text-[10px] font-semibold text-red-800">
                  Suggested organisation is missing. Re-run the audit before applying this change.
              </div>
          ) : null}
          '''), "                                            ")
          if "New organisation created — approval required" not in card:
              if source_marker not in card:
                  raise SystemExit("AiAuditCard source marker not found")
              card = card.replace(source_marker, org_status_ui + "\n" + source_marker, 1)

          card_path.write_text(card)
          PY

      - name: Validate backend syntax
        run: python -m py_compile backend/server.py

      - name: Validate audit UI markers
        shell: bash
        run: |
          grep -q 'approveSuggestedOrg' frontend/src/components/AiAuditCard.jsx
          grep -q 'New organisation created — approval required' frontend/src/components/AiAuditCard.jsx
          grep -q 'created_org_for_approval' backend/server.py
          grep -q 'before assigning this event to it' backend/server.py

      - name: Commit patch and remove one-shot workflow
        shell: bash
        run: |
          rm .github/workflows/_patch_admin_org_audit.yml
          git config user.name "blackrodnow-maintenance"
          git config user.email "actions@users.noreply.github.com"
          git add backend/server.py frontend/src/components/AiAuditCard.jsx .github/workflows/_patch_admin_org_audit.yml
          git commit -m "Improve AI audit organisation review flow"
          git push origin main
