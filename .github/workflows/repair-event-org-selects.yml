name: Repair event organisation selects

on:
  push:
    branches:
      - fix/event-org-default
    paths:
      - .github/workflows/repair-event-org-selects.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/event-org-default

      - name: Repair JSX select markup
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected 1 match, found {count}")
              return text.replace(old, new, 1)

          admin_path = Path('frontend/src/pages/Admin.jsx')
          admin = admin_path.read_text(encoding='utf-8')
          admin = replace_once(
              admin,
              '''<select data-testid="qc-ev-org" value={eventForm.orgSlug} onChange={(e) => <option value="">Choose organisation…</option>\nsetEventForm((p) => ({ ...p, orgSlug: e.target.value }))} className={inp}>''',
              '''<select data-testid="qc-ev-org" value={eventForm.orgSlug} onChange={(e) => setEventForm((p) => ({ ...p, orgSlug: e.target.value }))} className={inp}>\n                                        <option value="">Choose organisation…</option>''',
              'admin event organisation select',
          )
          admin = replace_once(
              admin,
              '''<select value={feedForm.orgSlug} onChange={(e) => <option value="">Choose organisation…</option>\nsetFeedForm((prev) => ({ ...prev, orgSlug: e.target.value }))} className={inp}>''',
              '''<select value={feedForm.orgSlug} onChange={(e) => setFeedForm((prev) => ({ ...prev, orgSlug: e.target.value }))} className={inp}>\n                                    <option value="">Choose organisation…</option>''',
              'admin feed organisation select',
          )
          admin = replace_once(
              admin,
              '''<select value={volForm.orgSlug} onChange={(e) => <option value="">Choose organisation…</option>\nsetVolForm((prev) => ({ ...prev, orgSlug: e.target.value }))} className={inp}>''',
              '''<select value={volForm.orgSlug} onChange={(e) => setVolForm((prev) => ({ ...prev, orgSlug: e.target.value }))} className={inp}>\n                                    <option value="">Choose organisation…</option>''',
              'admin volunteering organisation select',
          )
          admin_path.write_text(admin, encoding='utf-8')

          dashboard_path = Path('frontend/src/pages/OrgDashboard.jsx')
          dashboard = dashboard_path.read_text(encoding='utf-8')
          dashboard = replace_once(
              dashboard,
              '''                        <select\n                            value={selectedOrgSlug}\n                            onChange={(e) => <option value="">Choose organisation…</option>\nsetSelectedOrgSlug(e.target.value)}\n                            className="w-full px-4 py-2.5 rounded-2xl border border-border bg-background text-sm"\n                        >\n                            {orgs.map((o) => (''',
              '''                        <select\n                            value={selectedOrgSlug}\n                            onChange={(e) => setSelectedOrgSlug(e.target.value)}\n                            className="w-full px-4 py-2.5 rounded-2xl border border-border bg-background text-sm"\n                        >\n                            <option value="">Choose organisation…</option>\n                            {orgs.map((o) => (''',
              'dashboard locked selector',
          )
          dashboard = replace_once(
              dashboard,
              '''                    <select data-testid="org-switcher" value={selectedOrgSlug} onChange={(e) => <option value="">Choose organisation…</option>\nsetSelectedOrgSlug(e.target.value)}\n                        className="flex-1 sm:flex-none min-w-0 max-w-full truncate px-4 py-2 rounded-full border border-border bg-surface text-sm">\n                        {orgs.map((o) => (<option key={o.slug} value={o.slug}>{o.name}</option>))}''',
              '''                    <select data-testid="org-switcher" value={selectedOrgSlug} onChange={(e) => setSelectedOrgSlug(e.target.value)}\n                        className="flex-1 sm:flex-none min-w-0 max-w-full truncate px-4 py-2 rounded-full border border-border bg-surface text-sm">\n                        <option value="">Choose organisation…</option>\n                        {orgs.map((o) => (<option key={o.slug} value={o.slug}>{o.name}</option>))}''',
              'dashboard organisation switcher',
          )
          dashboard_path.write_text(dashboard, encoding='utf-8')

          # Static sanity checks for the regression and JSX damage from the first pass.
          joined = admin + '\n' + dashboard
          if '=> <option value="">' in joined:
              raise SystemExit('Malformed option still appears inside an onChange handler')
          if '|| orgs[0]?.slug' in admin or 'orgs[0]?.slug' in dashboard:
              raise SystemExit('Unsafe first-organisation fallback returned')
          if admin.count('<option value="">Choose organisation…</option>') < 3:
              raise SystemExit('Admin organisation placeholders missing')
          if dashboard.count('<option value="">Choose organisation…</option>') < 2:
              raise SystemExit('Dashboard organisation placeholders missing')

          print('Organisation selectors repaired and safeguards verified.')
          PY

      - name: Commit repair and remove one-shot workflow
        shell: bash
        run: |
          rm .github/workflows/repair-event-org-selects.yml
          git config user.name "Blackrod Now maintenance"
          git config user.email "actions@users.noreply.github.com"
          git add frontend/src/pages/Admin.jsx frontend/src/pages/OrgDashboard.jsx .github/workflows/repair-event-org-selects.yml
          git diff --cached --check
          git commit -m "fix: require explicit organisation selection"
          git push origin HEAD:fix/event-org-default
